<head>

     Worker ของเราเอง) — ถ้ามีโค้ดแปลกปลอมหลุดเข้ามารันในหน้า จะโหลดสคริปต์จากเว็บ
     อื่นหรือแอบส่ง token/ข้อมูลออกไปเซิร์ฟเวอร์อื่นผ่าน fetch/รูป/ฟอร์มไม่ได้
     เพิ่มปลายทางใหม่ (Worker/CDN) ต้องมาเพิ่มในนี้ด้วย ไม่งั้นเบราว์เซอร์จะบล็อก -->

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>ประวัติรายงาน · SONGDEE GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<style>
  :root{
    --bg:#f6f5f2;
    --bg-panel:#ffffff;
    --bg-panel-2:#efeeea;
    --line:#e0ddd7;
    --line-soft:#e8e6e1;
    --text:#28282a;
    --text-dim:#68676c;
    --text-faint:#97969b;
    --accent:#d81921;
    --accent-2:#3ddc97;
    --danger:#dc2626;
    --r-sm:12px;
    --r-md:16px;
    --r-lg:22px;
    --r-pill:999px;
    --shadow-sm:0 1px 2px rgba(20,20,20,.06);
    --shadow-md:0 14px 34px -18px rgba(20,20,20,.18);
    --hue-blue:#5b8def;
    --hue-purple:#a78bfa;
    --hue-pink:#f472b6;
    --hue-cyan:#22d3ee;
  }
  /* โหมดมืด — ดู form.html's toggleTheme()/sd-theme comment สำหรับรายละเอียด */
  :root[data-theme="dark"]{
    --bg:#0e0e10;
    --bg-panel:#1e1e22;
    --bg-panel-2:#28282c;
    --line:#45454c;
    --line-soft:#36363c;
    --text:#f5f5f5;
    --text-dim:#b7b7bd;
    --text-faint:#8b8b92;
    --accent:#ff5b5b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 14px 34px -18px rgba(0,0,0,.8);
  }
  [data-theme="dark"] header{background:rgba(14,14,16,.85);}
  [data-theme="dark"] .card{border-color:var(--line);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(216,25,33,.04) 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,.04) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    position:relative;
  }
  .ambient-orbs{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
  .ambient-orbs span{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.13;
    animation:orbDrift 26s ease-in-out infinite alternate;
  }
  .ambient-orbs span:nth-child(1){
    width:300px; height:300px; top:-60px; right:-80px;
    background:radial-gradient(circle, var(--accent), transparent 70%);
    animation-duration:24s;
  }
  .ambient-orbs span:nth-child(2){
    width:280px; height:280px; bottom:5%; left:-90px;
    background:radial-gradient(circle, var(--hue-purple), transparent 70%);
    animation-duration:30s; animation-delay:-10s;
  }
  @keyframes orbDrift{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(-20px,26px) scale(1.08);}
  }
  @media (prefers-reduced-motion: reduce){
    .ambient-orbs span{animation:none !important;}
  }
    font-family:'Noto Sans Thai',sans-serif;
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
  header{
    border-bottom:1px solid var(--line-soft);
    background:rgba(255,255,255,.82);
    position:sticky; top:0; z-index:10;
    backdrop-filter:blur(14px);
  }
  /* บนจอกว้าง (เว็บ) main{max-width:640px} ทำให้เนื้อหาลอยแคบกลางจอ แต่ header
     เดิมไม่มี max-width เลยยืดเต็มจอ - แถบบนกับเนื้อหาด้านล่างเลยไม่ตรงแนวกัน
     ดูเหมือนวางผิดที่ ครอบเนื้อหา header ไว้ในเส้นกึ่งกลางความกว้างเท่า main
     ให้ชิดแนวเดียวกัน (พื้นหลัง/เส้นขอบยังยืดเต็มจอเหมือนเดิม กระทบแค่จอกว้าง
     มือถือหน้าจอแคบกว่า 640px อยู่แล้วไม่เห็นความต่างเลย) */
  .header-inner{
    max-width:640px; margin:0 auto;
    padding:18px 18px 14px;
    position:relative;
  }
  .theme-toggle{
    position:absolute; top:14px; right:16px;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line-soft); background:var(--bg-panel-2);
    color:var(--text-dim); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
  header .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); background:rgba(216,25,33,.1);
    border:1px solid rgba(216,25,33,.22); border-radius:var(--r-pill);
    padding:4px 10px; margin-bottom:10px;
  }
  header h1{
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:22px; margin:0;
    letter-spacing:-.01em;
  }
  .tester-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--text-dim); margin-top:10px;
  }
  .tester-bar .who{color:var(--accent-2); font-weight:600;}
  .tester-bar a, .tester-bar .link{cursor:pointer; text-decoration:underline; text-underline-offset:2px; color:inherit; transition:color .15s ease;}
  .tester-bar a:hover, .tester-bar .link:hover{color:var(--accent);}
  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  .history-item{
    border:1px solid var(--line-soft); border-radius:var(--r-md); padding:13px 15px;
    margin-bottom:10px; background:var(--bg-panel); position:relative;
    box-shadow:var(--shadow-sm);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .history-item:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .history-item .hi-link{display:block; text-decoration:none; color:inherit; cursor:pointer; padding-right:64px;}
  .history-item .hi-row{display:flex; align-items:flex-start; gap:11px;}
  .history-item .hi-icon{
    width:34px; height:34px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    background:var(--bg-panel-2); border:1px solid var(--line-soft);
  }
  .history-item.tpl-upgrade .hi-icon{background:linear-gradient(150deg, rgba(216,25,33,.22), rgba(216,25,33,.06)); border-color:rgba(216,25,33,.28);}
  .history-item.tpl-new_install .hi-icon{background:linear-gradient(150deg, rgba(61,220,151,.22), rgba(61,220,151,.06)); border-color:rgba(61,220,151,.28);}
  .history-item.tpl-repair .hi-icon{background:linear-gradient(150deg, rgba(220,38,38,.18), rgba(220,38,38,.06)); border-color:rgba(220,38,38,.26);}
  .history-item .hi-text{flex:1; min-width:0;}
  .history-item .title{font-size:14px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .history-item .meta{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .hi-sent-badge{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;}
  .hi-sent-badge.sent{color:#3ddc97; background:rgba(61,220,151,.14); border:1px solid rgba(61,220,151,.28);}
  .hi-sent-badge.unsent{color:#ffb020; background:rgba(255,176,32,.14); border:1px solid rgba(255,176,32,.28);}
  .hi-menu-btn{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:8px;
    border:1px solid var(--line-soft); background:var(--bg-panel-2); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; cursor:pointer;
  }
  .hi-menu-btn:hover{color:var(--text); border-color:var(--accent);}
  .hi-menu{
    position:absolute; top:38px; right:10px; z-index:30; min-width:210px;
    background:var(--bg-panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow-md); padding:6px; display:flex; flex-direction:column; gap:2px;
  }
  .hi-menu-status{font-size:11px; color:var(--text-dim); padding:6px 8px 8px; border-bottom:1px solid var(--line-soft); margin-bottom:2px;}
  .hi-menu-item{
    display:block; padding:8px 8px; border-radius:7px; font-size:13px; color:var(--text);
    text-decoration:none; cursor:pointer; background:none; border:none; text-align:left; font-family:inherit;
  }
  .hi-menu-item:hover{background:var(--bg-panel-2);}
  .hi-expand-btn{
    position:absolute; top:10px; right:42px; width:26px; height:26px; border-radius:8px;
    border:1px solid var(--line-soft); background:var(--bg-panel-2); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; cursor:pointer;
    transition:transform .15s ease;
  }
  .hi-expand-btn:hover{color:var(--text); border-color:var(--accent);}
  .hi-expand-btn.open{transform:rotate(180deg);}
  .hi-expand{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft);
    font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; gap:5px;
  }
  .hi-expand .warn{color:#ffb020;}
  .hi-expand .ok{color:#3ddc97;}
  .hi-retrack-btn{
    align-self:flex-start; margin-top:3px; font-size:12px; font-weight:600;
    padding:6px 11px; border-radius:var(--r-pill); border:1px solid var(--line-soft);
    background:var(--bg-panel-2); color:var(--text); cursor:pointer; font-family:inherit;
  }
  .hi-retrack-btn:hover{border-color:var(--accent); color:var(--accent);}
  .date-group{
    font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;
    margin:16px 0 8px; padding-left:2px;
  }
  .date-group:first-child{margin-top:0;}
  .empty, .err, .loading{color:var(--text-dim); font-size:13px; padding:40px 0; text-align:center;}
  .skeleton-wrap{display:flex; flex-direction:column; gap:10px;}
  .skeleton-row{
    height:60px; border-radius:var(--r-md);
    background:linear-gradient(90deg, var(--bg-panel) 25%, var(--line-soft) 37%, var(--bg-panel) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}
  @media (prefers-reduced-motion: reduce){.skeleton-row{animation:none;}}
  .err{color:var(--danger);}
  .page-tabs{display:flex; gap:6px; margin-top:12px;}
  .page-tabs a, .page-tabs span.tab{
    flex:1; padding:9px 8px; border-radius:var(--r-sm); border:1px solid var(--line-soft);
    background:var(--bg-panel-2); color:var(--text-dim); font-family:'Noto Sans Thai',sans-serif;
    font-size:13px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .page-tabs a:hover{border-color:var(--text-dim); color:var(--text);}
  .page-tabs .active{
    background:rgba(216,25,33,0.16); border-color:var(--accent); color:var(--accent); cursor:default;
  }
  .app-hidden{display:none !important;}
  .scope-toggle{margin-bottom:14px;}

  .history-item-wrap{display:flex; gap:8px; align-items:stretch; margin-bottom:10px;}
  .history-item-wrap .history-item{flex:1; margin:0;}
  .history-item-wrap .del-btn{
    flex-shrink:0; width:40px; border:1px solid var(--line-soft); border-radius:var(--r-md);
    background:var(--bg-panel-2); color:var(--danger); font-size:15px; cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .history-item-wrap .del-btn:hover{background:rgba(220,38,38,.1); border-color:var(--danger);}
  .history-item .owner{font-size:11px; color:var(--hue-purple); font-weight:600; margin-top:3px;}

  .card{
    --card-hue:var(--hue-purple);
    position:relative; overflow:hidden;
    background:linear-gradient(165deg, rgba(255,255,255,.025), transparent 45%), var(--bg-panel);
    border:1px solid var(--line-soft); border-radius:var(--r-lg);
    padding:18px; margin-top:22px;
    box-shadow:var(--shadow-sm), var(--shadow-md);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; bottom:0; width:3px;
    background:var(--card-hue); opacity:.6;
  }
  .card h2{font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:15.5px; margin:0 0 12px;}
  #changeLogRows .log-row{border:1px solid var(--line-soft); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:8px; background:var(--bg-panel-2);}
  #changeLogRows .log-head{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; flex-wrap:wrap;}
  #changeLogRows .log-actor{font-weight:600; color:var(--text);}
  #changeLogRows .log-time{color:var(--text-faint); font-size:11px; font-family:'IBM Plex Mono',monospace;}
  #changeLogRows .log-subject{font-size:12.5px; color:var(--text-dim); margin-top:5px;}
  #changeLogRows .action-badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill); text-transform:uppercase; letter-spacing:.03em;}
  #changeLogRows .action-badge.create{background:rgba(61,220,151,.14); color:var(--accent-2); border:1px solid rgba(61,220,151,.3);}
  #changeLogRows .action-badge.update{background:rgba(91,141,239,.14); color:var(--hue-blue); border:1px solid rgba(91,141,239,.3);}
  #changeLogRows .action-badge.delete{background:rgba(220,38,38,.14); color:var(--danger); border:1px solid rgba(220,38,38,.3);}
  #changeLogRows .diff-list{margin:8px 0 0; padding-left:0; list-style:none; font-size:12px;}
  #changeLogRows .diff-list li{padding:5px 0; border-top:1px dashed var(--line-soft);}
  #changeLogRows .diff-list li:first-child{border-top:none;}
  #changeLogRows .diff-list .f-label{color:var(--text-faint); font-weight:600; display:block; margin-bottom:1px;}
  #changeLogRows .diff-list .f-from{color:var(--danger); text-decoration:line-through; opacity:.8;}
  #changeLogRows .diff-list .f-to{color:var(--accent-2);}
  #changeLogRows .diff-list .f-arrow{color:var(--text-faint); margin:0 4px;}

  /* ลูกเล่น — matches form.html/index.html's entrance touch. Skipped
     entirely under prefers-reduced-motion, not just shortened. */
  @keyframes cardRise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .history-item-wrap{animation:cardRise .45s cubic-bezier(.22,.9,.32,1) backwards;}
  .history-item-wrap:nth-child(1){animation-delay:.02s;}
  .history-item-wrap:nth-child(2){animation-delay:.06s;}
  .history-item-wrap:nth-child(3){animation-delay:.1s;}
  .history-item-wrap:nth-child(4){animation-delay:.14s;}
  .history-item-wrap:nth-child(5){animation-delay:.18s;}
  .history-item-wrap:nth-child(6){animation-delay:.22s;}
  @media (prefers-reduced-motion: reduce){
    .history-item-wrap{animation:none !important;}
  }

  /* จอกว้าง: 640px แคบเกินไป ดูเหมือนแอพมือถือลอยกลางจอเปล่าๆ ขยายเนื้อหา
     ให้กว้างขึ้น และจัดรายการรายงานเป็นหลายคอลัมน์แทนแถวเดียวยาวๆ */
  @media (min-width:860px){
    /* min(...,vw) แทนเลขคงที่ - กว้างขึ้นตามจอจริง ไม่ใช่หยุดโตที่ 880px
       เฉยๆแล้วเหลือขอบว่างโล่งๆ ทั้งสองข้างบนจอที่ใหญ่กว่านั้นมาก */
    .header-inner, main{max-width:min(1400px, 94vw);}
    #list{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:10px;}
    .history-item-wrap{margin-bottom:0;}
    .date-group{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<div class="ambient-orbs" aria-hidden="true"><span></span><span></span></div>

<header>
  <div class="header-inner">
    <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" title="สลับโหมดขาว/ดำ">🌙</button>
    <div class="eyebrow">SONGDEE GPS · เทสช่าง</div>
    <h1>ประวัติรายงาน</h1>
    <div class="tester-bar" id="testerBar" style="display:none">
      <span>ผู้ทดสอบ: <span class="who" id="testerName"></span></span>
      <span>
        <a href="form.html">+ รายงานใหม่</a>
        <span class="link" onclick="doLogout()">ออกจากระบบ</span>
      </span>
    </div>
    <div class="page-tabs" id="pageTabs" style="display:none">
      <a href="index.html">Dashboard</a>
      <a href="form.html">ฟอร์ม</a>
      <span class="tab active">ประวัติ</span>
    </div>
  </div>
</header>

<main>
  <div class="page-tabs scope-toggle app-hidden" id="scopeToggle">
    <span class="tab active" id="scopeMine" onclick="setScope('mine')">รายงานของฉัน</span>
    <span class="tab" id="scopeAll" onclick="setScope('all')">ทั้งหมด (แอดมิน)</span>
  </div>
  <div id="list" class="loading">กำลังตรวจสอบสิทธิ์...</div>
  <div class="card app-hidden" id="changeLogCard">
    <h2>ประวัติการเปลี่ยนแปลง (แอดมิน)</h2>
    <div id="changeLogRows" class="loading">กำลังโหลด...</div>
  </div>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7rlrX4YvmDzPgV2n76Dg2eiy84bVmeVw",
  authDomain: "songdee-stock.firebaseapp.com",
  projectId: "songdee-stock",
  storageBucket: "songdee-stock.firebasestorage.app",
  messagingSenderId: "702521617982",
  appId: "1:702521617982:web:dcb3c77e44d208a679ab6f"
};
/* ตัวนับการอ่าน Firestore ของแอปนี้ (ไม่กินโควตา Firestore — ส่งยอดไปเก็บที่ songdee-line-proxy /stats/reads)
   นับเฉพาะที่อ่านจาก server (ไม่นับจากแคชในเครื่อง) แยกตามคอลเลกชัน: get() = จำนวนเอกสาร (อย่างน้อย 1),
   onSnapshot = ครั้งแรกทั้งหมด แล้วนับเฉพาะเอกสารที่เปลี่ยน · ส่งยอดทุก 15 นาที และตอนปิด/สลับออกจากแอป
   ตัวเลขเป็นค่าประมาณ (ใกล้เคียงยอดที่ Firebase คิด) ไว้ดูว่าแอปไหน/ส่วนไหนอ่านเยอะ */
function installReadMeter(appName, statsUrl, headersFn){
  try{
    const fs = window.firebase && firebase.firestore;
    if(!fs || !fs.Query || !fs.DocumentReference || window.__readMeter) return;
    const counts = {}; window.__readMeter = counts;
    const add = (name, n)=>{ if(n > 0) counts[name] = (counts[name]||0) + n; };
    const top = path=> (String(path||'').split('/').filter(Boolean)[0]) || 'other';
    const qName = q=>{ try{
      if(q.path) return top(q.path);
      const p = q._delegate && q._delegate._query && q._delegate._query.path;
      return p ? top(p.canonicalString ? p.canonicalString() : String(p)) : 'query';
    }catch(e){ return 'query'; } };
    const fromServer = s=> !(s && s.metadata && s.metadata.fromCache);
    const QP = fs.Query.prototype, DP = fs.DocumentReference.prototype;
    const qGet = QP.get;
    QP.get = function(){ const name = qName(this);
      return qGet.apply(this, arguments).then(s=>{ try{ if(fromServer(s)) add(name, Math.max(1, s.size)); }catch(e){} return s; }); };
    const dGet = DP.get;
    DP.get = function(){ const name = top(this.path) + '(doc)';
      return dGet.apply(this, arguments).then(s=>{ try{ if(fromServer(s)) add(name, 1); }catch(e){} return s; }); };
    const wrapListen = (orig, nameOf, isDoc)=> function(){
      const name = nameOf(this) + '(live)';
      const args = [...arguments]; let first = true;
      const count = s=>{ try{ if(!fromServer(s)) return;
        if(isDoc){ add(name, 1); return; }
        if(first){ add(name, Math.max(1, s.size)); first = false; return; }
        add(name, s.docChanges().length);
      }catch(e){} };
      const i = args.findIndex(a=> typeof a === 'function' || (a && typeof a.next === 'function'));
      if(i > -1){
        if(typeof args[i] === 'function'){ const fn = args[i]; args[i] = function(s){ count(s); return fn.apply(this, arguments); }; }
        else { const ob = args[i]; args[i] = {...ob, next: s=>{ count(s); return ob.next(s); }}; }
      }
      return orig.apply(this, args);
    };
    QP.onSnapshot = wrapListen(QP.onSnapshot, qName, false);
    DP.onSnapshot = wrapListen(DP.onSnapshot, d=>top(d.path), true);
    let busy = false;
    const flush = async ()=>{
      if(busy) return;
      const c = {...counts}; if(!Object.keys(c).length) return;
      busy = true; Object.keys(c).forEach(k=> delete counts[k]);
      try{
        const h = await headersFn();
        const r = await fetch(statsUrl, {method:'POST', headers:h, body:JSON.stringify({app:appName, counts:c}), keepalive:true});
        if(!r.ok) throw new Error('HTTP '+r.status);
      }catch(e){ Object.entries(c).forEach(([k,n])=> counts[k] = (counts[k]||0) + n); }
      busy = false;
    };
    window.__flushReadMeter = flush;
    setInterval(flush, 15*60*1000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flush(); });
  }catch(e){ console.warn('[read meter]', e); }
}
firebase.initializeApp(FIREBASE_CONFIG);
installReadMeter('qc-history', 'https://songdee-line-proxy.songdeegps.workers.dev/stats/reads', async()=>({'Content-Type':'application/json', Authorization:'Bearer '+await firebase.auth().currentUser.getIdToken()}));
const _auth = firebase.auth();
const _db = firebase.firestore();

const TEMPLATE_LABELS = { upgrade:"อัปเกรด", new_install:"ติดตั้งใหม่", repair:"ซ่อม", remove:"ถอดย้ายอุปกรณ์" };
const TEMPLATE_ICONS = { upgrade:"⬆️", new_install:"✨", repair:"🛠️", remove:"📤" };
const ACTION_LABELS = { create:"เพิ่มใหม่", update:"แก้ไข", delete:"ลบ" };

let currentUser = null;
let isAdmin = false;
let viewScope = 'mine'; // 'mine' | 'all' (admin only)

function escapeHtmlLite(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ชิมเมอร์ระหว่างโหลด แทนตัวหนังสือ "กำลังโหลด..." เฉยๆ
function renderSkeleton(container, count){
  container.className = 'skeleton-wrap';
  container.innerHTML = Array.from({length: count}).map(()=>'<div class="skeleton-row"></div>').join('');
}

function doLogout(){
  _auth.signOut().then(()=>{ location.href = 'index.html'; });
}

function syncThemeToggleIcon(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('sd-theme', 'light'); }catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try{ localStorage.setItem('sd-theme', 'dark'); }catch(e){}
  }
  syncThemeToggleIcon();
}
syncThemeToggleIcon();

_auth.onAuthStateChanged(async user=>{
  const listEl = document.getElementById('list');
  if(!user){
    // Login lives on index.html — bounce back there instead of duplicating the form.
    location.href = 'index.html';
    return;
  }
  try{
    const roleSnap = await _db.collection('roles').doc(user.uid).get();
    const role = roleSnap.exists ? roleSnap.data() : null;
    if(!role || !role.techName){
      listEl.innerHTML = '<div class="err">บัญชีนี้ยังไม่ได้กำหนดชื่อช่าง กรุณาให้แอดมินตั้งค่าในระบบ Stock ก่อน</div>';
      return;
    }
    currentUser = user;
    isAdmin = role.role === 'admin';
    document.getElementById('testerName').textContent = role.techName;
    document.getElementById('testerBar').style.display = 'flex';
    document.getElementById('pageTabs').style.display = 'flex';

    if(isAdmin){
      document.getElementById('scopeToggle').classList.remove('app-hidden');
      document.getElementById('changeLogCard').classList.remove('app-hidden');
      loadChangeLog();
    }
    await loadReports();
  }catch(e){
    listEl.innerHTML = `<div class="err">โหลดประวัติไม่สำเร็จ: ${escapeHtmlLite(e.message)}</div>`;
  }
});

function setScope(scope){
  if(scope === viewScope) return;
  viewScope = scope;
  document.getElementById('scopeMine').classList.toggle('active', scope === 'mine');
  document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
  loadReports();
}

// where()+orderBy() on different fields needs a composite index we don't
// have — filter server-side (no orderBy) for the "mine" view, sort
// client-side instead.
// บั๊กเดิม: "all" (admin) เคยใช้ .limit(300) ตรงๆ โดยไม่ orderBy() มาก่อน —
// Firestore ไม่มี orderBy ให้ limit() ทำงานแบบ "300 เอกสารแรกตามลำดับ
// เอกสาร (document ID)" ซึ่งไม่เกี่ยวกับเวลาสร้างเลย ไม่ใช่ "300 รายงาน
// ล่าสุด" จริงๆ ทำให้รายงานที่เพิ่งส่งไปบางใบหลุดจากลิสต์ไปเฉยๆ (สุ่มๆ ตาม
// ID ของเอกสาร) ทั้งที่บันทึกลง Firestore สำเร็จแล้ว — เป็นสาเหตุของ "ส่งเข้า
// Line แล้วไม่ขึ้นในรายการ" ที่รายงานไว้ (เช่น No.48 LCB1) orderBy() เดี่ยว
// (ไม่มี where ประกบ) ไม่ต้องสร้าง composite index เพิ่ม — ใช้ index เดียวกับ
// ที่ index.html ใช้งานอยู่แล้วสำหรับ query เดียวกันนี้
async function loadReports(){
  const listEl = document.getElementById('list');
  renderSkeleton(listEl, 4);
  try{
    const showAll = isAdmin && viewScope === 'all';
    const query = showAll
      ? _db.collection('qc_reports').orderBy('createdAt', 'desc').limit(300)
      : _db.collection('qc_reports').where('techUid', '==', currentUser.uid).limit(2000);
    const snap = await query.get();
    const list = snap.docs
      .map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderList(list, showAll);
  }catch(e){
    listEl.innerHTML = `<div class="err">โหลดประวัติไม่สำเร็จ: ${escapeHtmlLite(e.message)}</div>`;
  }
}

async function deleteReportAsAdmin(doc){
  const tplLabel = TEMPLATE_LABELS[doc.tpl] || doc.tpl || '';
  const ok = confirm(`ลบรายงานนี้ทิ้งหรือไม่?\n\n${tplLabel} · ${doc.customer||''} · ทะเบียน ${doc.plate||'-'}\nผู้ทดสอบ: ${doc.techName||'-'}\n\nการลบไม่สามารถย้อนกลับได้ (แต่จะถูกบันทึกไว้ในประวัติการเปลี่ยนแปลง)`);
  if(!ok) return;
  try{
    await _db.collection('qc_report_logs').add({
      reportId: doc.id, action: 'delete', at: Date.now(),
      actorUid: currentUser.uid, actorName: (document.getElementById('testerName').textContent || ''),
      tpl: doc.tpl || '', customer: doc.customer || '', fleet: doc.fleet || '', plate: doc.plate || '',
      ownerTechName: doc.techName || '', ownerUid: doc.techUid || '',
      changes: [],
    });
    await _db.collection('qc_reports').doc(doc.id).delete();
    await loadReports();
    loadChangeLog();
  }catch(e){
    alert('ลบไม่สำเร็จ: ' + e.message);
  }
}

// วันที่/เวลาแบบ พ.ศ.-อิสระ (toLocaleString('th-TH') จะใช้ปี พ.ศ. ทำให้สับสน
// กับที่อื่นในแอปที่ใช้ ค.ศ. ทั้งหมด) — เลขเรียบง่าย dd/mm/yyyy hh:mm
function formatSentAt(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const pad = n=> String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// สรุปสถานะ track/ปิด Issue จาก doc.trackResults (บันทึกจาก runTrackWriteBacks()
// ใน form.html, ดูคอมเมนต์ที่นั่น) — เหมือนกับ index.html's trackStatusSummary()
// เป๊ะๆ (เดิมมีแค่ใน index.html — ตามที่ขอ "ให้ทุกเมนูมีการดูและปิด Issue เหมือน
// การซ่อมด้วย" พอร์ตมาที่นี่ด้วยให้หน้า "ประวัติ" เห็นสถานะเดียวกัน ไม่ใช่แค่
// Dashboard) รายงานเก่าก่อนฟีเจอร์นี้จะไม่มี trackResults เลย แสดง "ไม่มีข้อมูล"
// แทนการเดา ให้กดปุ่ม "Track ให้ใหม่อีกครั้ง" เพื่อ sync/เช็คสถานะจริงได้
function trackStatusSummary(doc){
  const tr = doc.trackResults;
  if(!tr){
    return { trackLine: 'ไม่มีข้อมูล (รายงานนี้ยังไม่เคยบันทึกสถานะ track)', trackClass: '', issueLine: null, issueClass: '' };
  }
  const relevantKeys = ['mdvrInstall', 'mdvrUnitSwap', 'mdvrChecklist', 'sheetUpdates', 'mdvrClears', 'deviceSwaps'];
  let anyRan = false, anyFail = false;
  relevantKeys.forEach(k=>{
    if(tr[k]){ anyRan = true; if(!tr[k].ok) anyFail = true; }
  });
  const atStr = doc.trackResultsAt ? ` (${formatSentAt(doc.trackResultsAt)})` : '';
  let trackLine, trackClass;
  if(!anyRan){ trackLine = 'ไม่มีรายการที่ต้อง track สำหรับรายงานนี้' + atStr; trackClass = ''; }
  else if(anyFail){ trackLine = '⚠️ Track ไม่สำเร็จบางรายการ' + atStr; trackClass = 'warn'; }
  else { trackLine = '✅ Track สำเร็จ' + atStr; trackClass = 'ok'; }

  let issueLine = null, issueClass = '';
  if(tr.issueClose){
    if(tr.issueClose.ok){
      const tickets = (tr.issueClose.tickets||[]).join(', ');
      issueLine = `✅ ปิด Issue แล้ว${tickets ? ' (' + escapeHtmlLite(tickets) + ')' : ''}`;
      issueClass = 'ok';
    } else {
      issueLine = `⚠️ ปิด Issue ไม่สำเร็จ: ${escapeHtmlLite(tr.issueClose.error || '')}`;
      issueClass = 'warn';
    }
  }
  return { trackLine, trackClass, issueLine, issueClass };
}

// เมนู ⋮ ของแต่ละการ์ด — เปิดได้ทีละอันเท่านั้น และปิดเองเมื่อคลิกนอกเมนู
function closeAllHiMenus(){
  document.querySelectorAll('.hi-menu').forEach(m=> m.classList.add('app-hidden'));
}
document.addEventListener('click', closeAllHiMenus);

// "วันนี้"/"เมื่อวาน" instead of a bare date — doc.date is already YYYY-MM-DD
// (same format used to build today's/yesterday's comparison strings), so a
// plain string compare is enough, no timezone-sensitive Date parsing needed.
function relativeDateLabel(dateStr){
  if(!dateStr) return 'ไม่ระบุวันที่';
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if(dateStr === today.toISOString().slice(0,10)) return 'วันนี้';
  if(dateStr === yesterday.toISOString().slice(0,10)) return 'เมื่อวาน';
  return dateStr.split('-').reverse().join('/');
}

function renderList(list, showAdmin){
  const listEl = document.getElementById('list');
  if(!list.length){
    listEl.innerHTML = '<div class="empty">ยังไม่มีรายงาน</div>';
    return;
  }
  listEl.innerHTML = '';
  listEl.className = '';
  let lastGroup = null;
  list.forEach(doc=>{
    const group = relativeDateLabel(doc.date);
    if(group !== lastGroup){
      const h = document.createElement('div');
      h.className = 'date-group';
      h.textContent = group;
      listEl.appendChild(h);
      lastGroup = group;
    }
    const tplLabel = TEMPLATE_LABELS[doc.tpl] || doc.tpl || '';
    const tplIcon = TEMPLATE_ICONS[doc.tpl] || '📄';
    const editHref = `form.html?report=${encodeURIComponent(doc.id)}`;
    const resendHref = `form.html?report=${encodeURIComponent(doc.id)}&autosend=1`;
    const retrackHref = `form.html?report=${encodeURIComponent(doc.id)}&retrack=1`;
    const sentBadge = doc.lineSentAt
      ? `<span class="hi-sent-badge sent">✓ ส่งแล้ว</span>`
      : `<span class="hi-sent-badge unsent">ยังไม่ส่ง LINE</span>`;
    const sentStatusText = doc.lineSentAt
      ? `ส่งเข้า LINE แล้ว — ${formatSentAt(doc.lineSentAt)}`
      : 'ยังไม่เคยส่งเข้า LINE';
    const { trackLine, trackClass, issueLine, issueClass } = trackStatusSummary(doc);
    const ownerLine = showAdmin ? `<div class="owner">ผู้ทดสอบ: ${escapeHtmlLite(doc.techName||'-')}</div>` : '';
    // ถอดย้ายอุปกรณ์ — doc.plate คือทะเบียนเก่า (คันที่ถอดออกมา) เลเบลให้ชัด
    // กว่า "ทะเบียน" เฉยๆ และโชว์ทะเบียนใหม่ด้วยถ้ามี (ดู form.html's dual-plate)
    const plateMeta = (doc.tpl === 'remove')
      ? `ทะเบียนเก่า: ${escapeHtmlLite(doc.plate||'-')}${doc.newPlate ? ` → ใหม่: ${escapeHtmlLite(doc.newPlate)}` : ''}`
      : `ทะเบียน: ${escapeHtmlLite(doc.plate||'-')}`;

    const wrap = document.createElement('div');
    wrap.className = 'history-item-wrap';
    const item = document.createElement('div');
    item.className = 'history-item' + (doc.tpl ? ' tpl-' + doc.tpl : '');
    item.innerHTML = `
      <a class="hi-link" href="${editHref}">
        <div class="hi-row">
          <div class="hi-icon">${tplIcon}</div>
          <div class="hi-text">
            <div class="title">${escapeHtmlLite(tplLabel)} ${escapeHtmlLite(doc.customer||'')} ${sentBadge}</div>
            <div class="meta">${plateMeta}</div>
            ${ownerLine}
          </div>
        </div>
      </a>
      <button type="button" class="hi-expand-btn" title="ดูสถานะ Track/Issue">▾</button>
      <button type="button" class="hi-menu-btn" title="ตัวเลือกเพิ่มเติม">⋮</button>
      <div class="hi-menu app-hidden">
        <div class="hi-menu-status">${escapeHtmlLite(sentStatusText)}</div>
        <a class="hi-menu-item" href="${resendHref}">📤 ส่งเข้า LINE อีกครั้ง</a>
        <a class="hi-menu-item" href="${editHref}">✏️ แก้ไขรายงาน</a>
      </div>
      <div class="hi-expand app-hidden">
        ${issueLine ? `<div class="${issueClass}">${issueLine}</div>` : ''}
        <div class="${trackClass}">${trackLine}</div>
        <a class="hi-retrack-btn" href="${retrackHref}">🔄 Track ให้ใหม่อีกครั้ง</a>
      </div>
    `;
    item.querySelector('.hi-menu-btn').addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      const menu = item.querySelector('.hi-menu');
      const willShow = menu.classList.contains('app-hidden');
      closeAllHiMenus();
      menu.classList.toggle('app-hidden', !willShow);
    });
    item.querySelector('.hi-expand-btn').addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      const panel = item.querySelector('.hi-expand');
      const btn = item.querySelector('.hi-expand-btn');
      const willShow = panel.classList.contains('app-hidden');
      panel.classList.toggle('app-hidden', !willShow);
      btn.classList.toggle('open', willShow);
    });
    item.querySelector('.hi-retrack-btn').addEventListener('click', e=>{ e.stopPropagation(); });
    wrap.appendChild(item);
    if(showAdmin){
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.type = 'button';
      delBtn.title = 'ลบรายงาน';
      delBtn.textContent = '🗑️';
      delBtn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); deleteReportAsAdmin(doc); };
      wrap.appendChild(delBtn);
    }
    listEl.appendChild(wrap);
  });
}

function formatLogTime(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadChangeLog(){
  const wrap = document.getElementById('changeLogRows');
  renderSkeleton(wrap, 3);
  try{
    const snap = await _db.collection('qc_report_logs').orderBy('at', 'desc').limit(200).get();
    const rows = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderChangeLog(rows);
  }catch(e){
    wrap.className = 'err';
    wrap.textContent = 'โหลดประวัติการเปลี่ยนแปลงไม่สำเร็จ: ' + e.message;
  }
}

function renderChangeLog(rows){
  const wrap = document.getElementById('changeLogRows');
  if(!rows.length){
    wrap.className = 'empty';
    wrap.textContent = 'ยังไม่มีการเปลี่ยนแปลง';
    return;
  }
  wrap.className = '';
  wrap.innerHTML = '';
  rows.forEach(r=>{
    const tplLabel = TEMPLATE_LABELS[r.tpl] || r.tpl || '';
    const actionLabel = ACTION_LABELS[r.action] || r.action || '';
    const row = document.createElement('div');
    row.className = 'log-row';
    const subjectBits = [tplLabel, r.customer, r.plate ? `ทะเบียน ${r.plate}` : ''].filter(Boolean).join(' · ');
    const ownerNote = r.action === 'delete' && r.ownerTechName ? ` (ของ ${escapeHtmlLite(r.ownerTechName)})` : '';
    let diffHtml = '';
    if(r.action === 'update' && Array.isArray(r.changes) && r.changes.length){
      diffHtml = '<ul class="diff-list">' + r.changes.map(c=>
        `<li><span class="f-label">${escapeHtmlLite(c.label)}</span><span class="f-from">${escapeHtmlLite(c.from)}</span><span class="f-arrow">→</span><span class="f-to">${escapeHtmlLite(c.to)}</span></li>`
      ).join('') + '</ul>';
    }
    row.innerHTML = `
      <div class="log-head">
        <span class="log-actor">${escapeHtmlLite(r.actorName||'-')}</span>
        <span class="action-badge ${escapeHtmlLite(r.action||'')}">${escapeHtmlLite(actionLabel)}</span>
        <span class="log-time">${formatLogTime(r.at)}</span>
      </div>
      <div class="log-subject">${escapeHtmlLite(subjectBits)}${ownerNote}</div>
      ${diffHtml}
    `;
    wrap.appendChild(row);
  });
}
