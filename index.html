<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard · SONGDEE GPS</title>
<meta name="app-version" content="1.6.1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#0b1220;
    --bg-panel:#121b2e;
    --bg-panel-2:#0f1729;
    --line:#223047;
    --line-soft:#1a2439;
    --text:#e7edf7;
    --text-dim:#8b9bb5;
    --accent:#ffb020;
    --accent-2:#3ddc97;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #16223a 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai','Kanit',sans-serif;
    min-height:100vh;
  }
  header{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,176,32,0.06), transparent);
    position:sticky; top:0; z-index:10;
    backdrop-filter:blur(10px);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px;
  }
  header h1{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:20px; margin:0;
    letter-spacing:.01em;
  }
  .version-tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;
    color:var(--text-dim); vertical-align:middle; margin-left:6px;
  }
  .tester-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--text-dim); margin-top:8px;
  }
  .tester-bar .who{color:var(--accent-2); font-weight:600;}
  .tester-bar a, .tester-bar .link{cursor:pointer; text-decoration:underline; text-underline-offset:2px; color:inherit;}
  .app-hidden{display:none !important;}
  .page-tabs{display:flex; gap:6px; margin-top:10px;}
  .page-tabs a, .page-tabs span.tab{
    flex:1; padding:9px 8px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text-dim); font-family:'Kanit',sans-serif;
    font-size:13px; font-weight:500; text-align:center; text-decoration:none; cursor:pointer;
  }
  .page-tabs .active{
    background:rgba(255,176,32,0.12); border-color:var(--accent); color:var(--accent); cursor:default;
  }
  .login-overlay{
    position:fixed; inset:0; z-index:300; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-overlay.hide{display:none;}
  .login-card{
    width:100%; max-width:360px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:14px; padding:24px;
  }
  .login-card h1{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:18px; margin:0 0 4px;
  }
  .login-card .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:18px;}
  .login-error{
    font-size:12.5px; color:var(--danger); margin-top:10px; min-height:1em;
  }
  label{
    display:block; font-size:12.5px; color:var(--text-dim); margin:10px 0 5px;
    font-weight:500;
  }
  input[type=text], input[type=password]{
    width:100%;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:11px 12px;
    font-size:14.5px;
    font-family:inherit;
  }
  input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,176,32,0.12);
  }
  .btn-primary{
    width:100%; margin-top:14px; padding:13px; border-radius:11px; border:none;
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
    background:var(--accent-2); color:#06251a;
  }
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  main{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat-card{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center;
  }
  .stat-card .num{font-family:'Kanit',sans-serif; font-size:28px; font-weight:600; color:var(--accent-2);}
  .stat-card .lbl{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .section-title{font-size:13px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 10px;}
  .history-item{
    border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; cursor:pointer; background:var(--bg-panel); text-decoration:none; display:block;
  }
  .history-item:hover{border-color:var(--accent);}
  .history-item .title{font-size:14px; font-weight:600; color:var(--text);}
  .history-item .meta{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .empty, .err, .loading{color:var(--text-dim); font-size:13px; padding:40px 0; text-align:center;}
  .err{color:var(--danger);}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1>เข้าสู่ระบบ</h1>
    <div class="sub">SONGDEE GPS · รายงานตรวจสอบงานช่าง</div>
    <label>อีเมล</label>
    <input type="text" id="loginEmail" autocomplete="username" placeholder="เช่น somchai@songdeegps.com">
    <label>รหัสผ่าน</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="รหัสผ่าน">
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<header>
  <div class="eyebrow">SONGDEE GPS · เทสช่าง</div>
  <h1>Dashboard <span id="versionTag" class="version-tag"></span></h1>
  <div class="tester-bar app-hidden" id="testerBar">
    <span>ผู้ทดสอบ: <span class="who" id="testerName"></span></span>
    <span>
      <a href="form.html">+ รายงานใหม่</a>
      <span class="link" onclick="doLogout()">ออกจากระบบ</span>
    </span>
  </div>
  <div class="page-tabs app-hidden" id="pageTabs">
    <span class="tab active">Dashboard</span>
    <a href="form.html">ฟอร์ม</a>
    <a href="history.html">ประวัติ</a>
  </div>
</header>

<main>
  <div id="stats" class="app-hidden">
    <div class="stat-row">
      <div class="stat-card"><div class="num" id="statTotal">-</div><div class="lbl">รายงานทั้งหมด</div></div>
      <div class="stat-card"><div class="num" id="statToday">-</div><div class="lbl">วันนี้</div></div>
    </div>
    <div class="section-title">รายงานล่าสุด (ทุกช่าง)</div>
  </div>
  <div id="list" class="loading">กำลังตรวจสอบสิทธิ์...</div>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7rlrX4YvmDzPgV2n76Dg2eiy84bVmeVw",
  authDomain: "songdee-stock.firebaseapp.com",
  projectId: "songdee-stock",
  storageBucket: "songdee-stock.firebasestorage.app",
  messagingSenderId: "702521617982",
  appId: "1:702521617982:web:dcb3c77e44d208a679ab6f"
};
firebase.initializeApp(FIREBASE_CONFIG);
const _auth = firebase.auth();
const _db = firebase.firestore();

const TEMPLATE_LABELS = { upgrade:"อัปเกรด", new_install:"ติดตั้งใหม่", repair:"ซ่อม" };

function escapeHtmlLite(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!email || !password){ err.textContent = 'กรอกอีเมลและรหัสผ่านให้ครบ'; return; }
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try{
    await _auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    const map = {
      'auth/invalid-email':'อีเมลไม่ถูกต้อง',
      'auth/user-not-found':'ไม่พบบัญชีนี้',
      'auth/wrong-password':'รหัสผ่านไม่ถูกต้อง',
      'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
      'auth/too-many-requests':'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่'
    };
    err.textContent = map[e.code] || ('เข้าสู่ระบบไม่สำเร็จ: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
}

function doLogout(){
  _auth.signOut();
}

_auth.onAuthStateChanged(async user=>{
  const overlay = document.getElementById('loginOverlay');
  const testerBar = document.getElementById('testerBar');
  const pageTabs = document.getElementById('pageTabs');
  const stats = document.getElementById('stats');
  const listEl = document.getElementById('list');
  if(!user){
    overlay.classList.remove('hide');
    testerBar.classList.add('app-hidden');
    pageTabs.classList.add('app-hidden');
    stats.classList.add('app-hidden');
    return;
  }
  const err = document.getElementById('loginError');
  try{
    const roleSnap = await _db.collection('roles').doc(user.uid).get();
    const role = roleSnap.exists ? roleSnap.data() : null;
    if(!role || !role.techName){
      err.textContent = 'บัญชีนี้ยังไม่ได้กำหนดชื่อช่าง (techName) กรุณาให้แอดมินตั้งค่าในระบบ Stock ก่อน';
      await _auth.signOut();
      return;
    }
    document.getElementById('testerName').textContent = role.techName;
    overlay.classList.add('hide');
    testerBar.classList.remove('app-hidden');
    pageTabs.classList.remove('app-hidden');
    stats.classList.remove('app-hidden');
    await loadDashboard();
  }catch(e){
    err.textContent = 'โหลดข้อมูลสิทธิ์ไม่สำเร็จ: ' + e.message;
    await _auth.signOut();
  }
});

async function loadDashboard(){
  const listEl = document.getElementById('list');
  listEl.className = 'loading';
  listEl.textContent = 'กำลังโหลด...';
  const todayStr = new Date().toISOString().slice(0,10);
  try{
    // firebase-firestore-compat doesn't expose count() aggregate queries here,
    // and where()+orderBy() on different fields needs a composite index we
    // don't have — fetch one ordered page (no where clause) and derive both
    // stats from it client-side instead.
    const snap = await _db.collection('qc_reports').orderBy('createdAt', 'desc').limit(1000).get();
    const all = snap.docs.map(d=>({id:d.id, ...d.data()}));
    document.getElementById('statTotal').textContent = all.length;
    document.getElementById('statToday').textContent = all.filter(d=>d.date===todayStr).length;
    renderList(all.slice(0, 20));
  }catch(e){
    listEl.className = 'err';
    listEl.textContent = 'โหลด Dashboard ไม่สำเร็จ: ' + e.message;
  }
}

function renderList(list){
  const listEl = document.getElementById('list');
  if(!list.length){
    listEl.className = 'empty';
    listEl.textContent = 'ยังไม่มีรายงาน';
    return;
  }
  listEl.className = '';
  listEl.innerHTML = '';
  list.forEach(doc=>{
    const dateStr = doc.date ? doc.date.split('-').reverse().join('/') : '(ไม่ระบุวันที่)';
    const tplLabel = TEMPLATE_LABELS[doc.tpl] || doc.tpl || '';
    const a = document.createElement('a');
    a.className = 'history-item';
    a.href = `form.html?report=${encodeURIComponent(doc.id)}`;
    a.innerHTML = `<div class="title">${escapeHtmlLite(dateStr)} ${escapeHtmlLite(tplLabel)} ${escapeHtmlLite(doc.customer||'')}</div><div class="meta">ทะเบียน: ${escapeHtmlLite(doc.plate||'-')} · ช่าง: ${escapeHtmlLite(doc.techName||'-')}</div>`;
    listEl.appendChild(a);
  });
}

const APP_VERSION = document.querySelector('meta[name="app-version"]').content;
document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
</script>

</body>
</html>
