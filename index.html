<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard · SONGDEE GPS</title>
<meta name="app-version" content="1.7.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#0b1220;
    --bg-panel:#121b2e;
    --bg-panel-2:#0f1729;
    --line:#223047;
    --line-soft:#1a2439;
    --text:#e7edf7;
    --text-dim:#8b9bb5;
    --accent:#ffb020;
    --accent-2:#3ddc97;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #16223a 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai','Kanit',sans-serif;
    min-height:100vh;
  }
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,176,32,0.06), transparent);
    position:sticky; top:0; z-index:10;
    backdrop-filter:blur(10px);
  }
  /* บนจอกว้าง (เว็บ) main{max-width:640px} ทำให้เนื้อหาลอยแคบกลางจอ แต่ header
     เดิมไม่มี max-width เลยยืดเต็มจอ - แถบบนกับเนื้อหาด้านล่างเลยไม่ตรงแนวกัน
     ดูเหมือนวางผิดที่ ครอบเนื้อหา header ไว้ในเส้นกึ่งกลางความกว้างเท่า main
     ให้ชิดแนวเดียวกัน (พื้นหลัง/เส้นขอบยังยืดเต็มจอเหมือนเดิม กระทบแค่จอกว้าง
     มือถือหน้าจอแคบกว่า 640px อยู่แล้วไม่เห็นความต่างเลย) */
  .header-inner{
    max-width:640px; margin:0 auto;
    padding:22px 18px 16px;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px;
  }
  header h1{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:20px; margin:0;
    letter-spacing:.01em;
  }
  .version-tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;
    color:var(--text-dim); vertical-align:middle; margin-left:6px;
  }
  .tester-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--text-dim); margin-top:8px;
  }
  .tester-bar .who{color:var(--accent-2); font-weight:600;}
  .tester-bar a, .tester-bar .link{cursor:pointer; text-decoration:underline; text-underline-offset:2px; color:inherit;}
  .app-hidden{display:none !important;}
  .page-tabs{display:flex; gap:6px; margin-top:10px;}
  .page-tabs a, .page-tabs span.tab{
    flex:1; padding:9px 8px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text-dim); font-family:'Kanit',sans-serif;
    font-size:13px; font-weight:500; text-align:center; text-decoration:none; cursor:pointer;
  }
  .page-tabs .active{
    background:rgba(255,176,32,0.12); border-color:var(--accent); color:var(--accent); cursor:default;
  }
  label{
    display:block; font-size:12.5px; color:var(--text-dim); margin:10px 0 5px;
    font-weight:500;
  }
  input[type=text], input[type=password]{
    width:100%;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:11px 12px;
    font-size:14.5px;
    font-family:inherit;
  }
  input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,176,32,0.12);
  }
  .btn-primary{
    width:100%; margin-top:14px; padding:13px; border-radius:11px; border:none;
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
    background:var(--accent-2); color:#06251a;
  }
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}

  /* Split-screen login (photo/illustration panel + form panel), styled with
     the app's own dark navy/amber palette instead of the light reference's
     colors — logging in and then landing on the (dark) Dashboard would
     otherwise jump jarringly between two unrelated themes. */
  .login-overlay{
    position:fixed; inset:0; z-index:300; background:var(--bg); overflow:auto;
  }
  .login-overlay.hide{display:none;}
  .login-langbar{position:absolute; top:16px; right:18px; z-index:2;}
  .lang-select{position:relative;}
  .lang-trigger{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    color:var(--text-dim); border-radius:9px; padding:7px 10px;
    font-family:inherit; font-size:12.5px; cursor:pointer;
  }
  .lang-trigger:hover{color:var(--text); border-color:var(--accent);}
  .lang-trigger svg{width:12px; height:12px;}
  .lang-menu{
    position:absolute; top:calc(100% + 6px); right:0; min-width:120px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:9px;
    overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .lang-menu div{padding:9px 12px; font-size:13px; color:var(--text-dim); cursor:pointer;}
  .lang-menu div:hover{background:var(--bg-panel-2); color:var(--text);}

  .login-split{min-height:100vh; display:flex;}
  .login-visual{
    display:none; position:relative; flex:1 1 46%; max-width:640px;
    background:linear-gradient(160deg, #172845 0%, #0b1220 65%);
    overflow:hidden;
  }
  .login-visual::after{
    content:''; position:absolute; top:0; right:-1px; bottom:0; width:70px;
    background:var(--accent); opacity:.85;
    clip-path:polygon(100% 0, 100% 100%, 0 65%);
  }
  .login-visual-art{position:absolute; inset:0; width:100%; height:100%;}
  .login-visual-text{position:absolute; left:44px; right:110px; bottom:48px;}
  .login-visual-brand{
    font-family:'Kanit',sans-serif; font-weight:700; font-size:22px;
    letter-spacing:.04em; color:#fff; margin-bottom:8px;
  }
  .login-visual-tagline{font-size:13.5px; color:rgba(231,237,247,0.75); line-height:1.65;}

  .login-panel{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:48px 20px;
  }
  .login-card{width:100%; max-width:380px;}
  .login-card h1{
    font-family:'Kanit',sans-serif; font-weight:600; font-size:21px; margin:0 0 6px;
  }
  .login-card .sub{font-size:13px; color:var(--text-dim); margin-bottom:22px;}
  .login-error{font-size:12.5px; color:var(--danger); margin-top:10px; min-height:1em;}

  .input-wrap{position:relative;}
  .input-wrap .input-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:var(--text-dim); pointer-events:none;
  }
  .input-wrap input{padding-left:36px;}
  .input-wrap input[type=password]{padding-right:38px;}
  .input-eye{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--text-dim); cursor:pointer; padding:7px;
  }
  .input-eye:hover{color:var(--text);}
  .input-eye svg{width:16px; height:16px;}
  .input-eye .eye-off{display:none;}
  .input-eye.showing .eye{display:none;}
  .input-eye.showing .eye-off{display:block;}

  .remember-row{
    display:flex; align-items:center; gap:8px; margin:16px 0 0;
    font-size:13px; color:var(--text-dim); font-weight:400; cursor:pointer;
  }
  .remember-row input{width:15px; height:15px; accent-color:var(--accent-2); cursor:pointer;}

  .login-footer{
    text-align:center; margin-top:26px; font-size:11px; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  @media (min-width:860px){
    .login-visual{display:block;}
  }
  main{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat-card{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center;
  }
  .stat-card .num{font-family:'Kanit',sans-serif; font-size:28px; font-weight:600; color:var(--accent-2);}
  .stat-card .lbl{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .section-title{font-size:13px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 10px;}
  .history-item{
    border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; cursor:pointer; background:var(--bg-panel); text-decoration:none; display:block;
  }
  .history-item:hover{border-color:var(--accent);}
  .history-item .title{font-size:14px; font-weight:600; color:var(--text);}
  .history-item .meta{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .empty, .err, .loading{color:var(--text-dim); font-size:13px; padding:40px 0; text-align:center;}
  .err{color:var(--danger);}
  /* จอกว้าง: 640px แคบเกินไป ดูเหมือนแอพมือถือลอยกลางจอเปล่าๆ ขยายเนื้อหา
     ให้กว้างขึ้น และจัดรายการรายงานเป็นหลายคอลัมน์แทนแถวเดียวยาวๆ */
  @media (min-width:860px){
    /* min(...,vw) แทนเลขคงที่ - กว้างขึ้นตามจอจริง ไม่ใช่หยุดโตที่ 880px
       เฉยๆแล้วเหลือขอบว่างโล่งๆ ทั้งสองข้างบนจอที่ใหญ่กว่านั้นมาก */
    .header-inner, main{max-width:min(1400px, 94vw);}
    .stat-row{max-width:480px;}
    #list{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:10px;}
    .history-item{margin-bottom:0;}
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-langbar">
    <div class="lang-select" id="langSelect">
      <button type="button" class="lang-trigger" id="langTrigger" onclick="toggleLangMenu()">
        <span id="langLabel">ไทย</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="lang-menu app-hidden" id="langMenu">
        <div onclick="setLang('th')">ไทย</div>
        <div onclick="setLang('en')">English</div>
      </div>
    </div>
  </div>

  <div class="login-split">
    <div class="login-visual">
      <svg class="login-visual-art" viewBox="0 0 640 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="loginDots" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.08"></circle>
          </pattern>
        </defs>
        <rect width="640" height="900" fill="url(#loginDots)"></rect>
        <path d="M40 760 C 180 700, 220 560, 300 480 S 480 300, 560 160" fill="none" stroke="#ffb020" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.75"></path>
        <circle cx="560" cy="160" r="34" fill="#ffb020" opacity="0.15"></circle>
        <circle cx="560" cy="160" r="20" fill="#ffb020" opacity="0.25"></circle>
        <path d="M560 122 c17 0 30 13 30 30 c0 22-30 46-30 46 s-30-24-30-46 c0-17 13-30 30-30z" fill="#ffb020"></path>
        <circle cx="560" cy="152" r="10" fill="#0b1220"></circle>
        <g transform="translate(255,455)">
          <rect x="0" y="6" width="46" height="22" rx="4" fill="#3ddc97"></rect>
          <rect x="34" y="0" width="18" height="16" rx="3" fill="#3ddc97"></rect>
          <circle cx="12" cy="30" r="6" fill="#0b1220" stroke="#3ddc97" stroke-width="2"></circle>
          <circle cx="40" cy="30" r="6" fill="#0b1220" stroke="#3ddc97" stroke-width="2"></circle>
        </g>
      </svg>
      <div class="login-visual-text">
        <div class="login-visual-brand">SONGDEE GPS</div>
        <div class="login-visual-tagline" data-i18n="tagline"></div>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <h1 data-i18n="welcome"></h1>
        <div class="sub" data-i18n="subtitle"></div>

        <label data-i18n="emailLabel"></label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
          <input type="text" id="loginEmail" autocomplete="username" data-i18n-placeholder="emailPlaceholder">
        </div>

        <label data-i18n="passwordLabel"></label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input type="password" id="loginPassword" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder">
          <button type="button" class="input-eye" id="pwToggle" onclick="togglePasswordVisibility()">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-3.22 4.24M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberMe" checked>
          <span data-i18n="remember"></span>
        </label>

        <button class="btn-primary" id="loginBtn" onclick="doLogin()" data-i18n="loginBtn"></button>
        <div class="login-error" id="loginError"></div>
      </div>
      <div class="login-footer">v<span id="loginVersion"></span></div>
    </div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="eyebrow">SONGDEE GPS · เทสช่าง</div>
    <h1>Dashboard <span id="versionTag" class="version-tag"></span></h1>
    <div class="tester-bar app-hidden" id="testerBar">
      <span>ผู้ทดสอบ: <span class="who" id="testerName"></span></span>
      <span>
        <a href="form.html">+ รายงานใหม่</a>
        <span class="link" onclick="doLogout()">ออกจากระบบ</span>
      </span>
    </div>
    <div class="page-tabs app-hidden" id="pageTabs">
      <span class="tab active">Dashboard</span>
      <a href="form.html">ฟอร์ม</a>
      <a href="history.html">ประวัติ</a>
    </div>
  </div>
</header>

<main>
  <div id="stats" class="app-hidden">
    <div class="stat-row">
      <div class="stat-card"><div class="num" id="statTotal">-</div><div class="lbl">รายงานทั้งหมด</div></div>
      <div class="stat-card"><div class="num" id="statToday">-</div><div class="lbl">วันนี้</div></div>
    </div>
    <div class="section-title">รายงานล่าสุด (ทุกช่าง)</div>
  </div>
  <div id="list" class="loading">กำลังตรวจสอบสิทธิ์...</div>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7rlrX4YvmDzPgV2n76Dg2eiy84bVmeVw",
  authDomain: "songdee-stock.firebaseapp.com",
  projectId: "songdee-stock",
  storageBucket: "songdee-stock.firebasestorage.app",
  messagingSenderId: "702521617982",
  appId: "1:702521617982:web:dcb3c77e44d208a679ab6f"
};
firebase.initializeApp(FIREBASE_CONFIG);
const _auth = firebase.auth();
const _db = firebase.firestore();

const TEMPLATE_LABELS = { upgrade:"อัปเกรด", new_install:"ติดตั้งใหม่", repair:"ซ่อม" };

function escapeHtmlLite(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Login screen text only (rest of the app stays Thai-only for now) — a
// small, extendable dict rather than a full app-wide i18n system nobody
// asked for.
const I18N = {
  th: {
    tagline: 'ระบบตรวจสอบงานติดตั้ง GPS / MDVR สำหรับทีมช่าง',
    welcome: 'ยินดีต้อนรับสู่ระบบ SONGDEE GPS',
    subtitle: 'เข้าสู่ระบบเพื่อเริ่มบันทึกรายงานตรวจสอบงาน',
    emailLabel: 'อีเมล',
    emailPlaceholder: 'เช่น somchai@songdeegps.com',
    passwordLabel: 'รหัสผ่าน',
    passwordPlaceholder: 'รหัสผ่าน',
    remember: 'จดจำฉันไว้',
    loginBtn: 'เข้าสู่ระบบ',
    loginBtnBusy: 'กำลังเข้าสู่ระบบ...',
    errRequired: 'กรอกอีเมลและรหัสผ่านให้ครบ',
    errRole: 'บัญชีนี้ยังไม่ได้กำหนดชื่อช่าง (techName) กรุณาให้แอดมินตั้งค่าในระบบ Stock ก่อน',
    errRoleLoad: 'โหลดข้อมูลสิทธิ์ไม่สำเร็จ: ',
    errGeneric: 'เข้าสู่ระบบไม่สำเร็จ: ',
    errMap: {
      'auth/invalid-email':'อีเมลไม่ถูกต้อง',
      'auth/user-not-found':'ไม่พบบัญชีนี้',
      'auth/wrong-password':'รหัสผ่านไม่ถูกต้อง',
      'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
      'auth/too-many-requests':'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่',
    },
  },
  en: {
    tagline: 'GPS / MDVR installation QC system for field technicians',
    welcome: 'Welcome to SONGDEE GPS',
    subtitle: 'Log in to start recording your inspection reports',
    emailLabel: 'Email',
    emailPlaceholder: 'e.g. somchai@songdeegps.com',
    passwordLabel: 'Password',
    passwordPlaceholder: 'Password',
    remember: 'Remember me',
    loginBtn: 'Log in',
    loginBtnBusy: 'Logging in...',
    errRequired: 'Please enter both email and password',
    errRole: 'This account has no technician name set yet — ask an admin to set it up in the Stock system first.',
    errRoleLoad: 'Failed to load account permissions: ',
    errGeneric: 'Login failed: ',
    errMap: {
      'auth/invalid-email':'Invalid email address',
      'auth/user-not-found':'No account found',
      'auth/wrong-password':'Incorrect password',
      'auth/invalid-credential':'Incorrect email or password',
      'auth/too-many-requests':'Too many attempts — please wait a moment',
    },
  },
};
let currentLang = localStorage.getItem('songdee_lang') === 'en' ? 'en' : 'th';

function t(key){ return I18N[currentLang][key] ?? I18N.th[key] ?? key; }

function applyLang(lang){
  currentLang = lang === 'en' ? 'en' : 'th';
  localStorage.setItem('songdee_lang', currentLang);
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.getElementById('langLabel').textContent = currentLang === 'en' ? 'English' : 'ไทย';
}

function setLang(lang){
  applyLang(lang);
  document.getElementById('langMenu').classList.add('app-hidden');
}

function toggleLangMenu(){
  document.getElementById('langMenu').classList.toggle('app-hidden');
}

document.addEventListener('click', e=>{
  const wrap = document.getElementById('langSelect');
  if(wrap && !wrap.contains(e.target)) document.getElementById('langMenu').classList.add('app-hidden');
});

function togglePasswordVisibility(){
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggle');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.classList.toggle('showing', !showing);
}

applyLang(currentLang);

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('rememberMe').checked;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!email || !password){ err.textContent = t('errRequired'); return; }
  btn.disabled = true; btn.textContent = t('loginBtnBusy');
  try{
    await _auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    await _auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    err.textContent = t('errMap')[e.code] || (t('errGeneric') + e.message);
  }
  btn.disabled = false; btn.textContent = t('loginBtn');
}

function doLogout(){
  _auth.signOut();
}

_auth.onAuthStateChanged(async user=>{
  const overlay = document.getElementById('loginOverlay');
  const testerBar = document.getElementById('testerBar');
  const pageTabs = document.getElementById('pageTabs');
  const stats = document.getElementById('stats');
  const listEl = document.getElementById('list');
  if(!user){
    overlay.classList.remove('hide');
    testerBar.classList.add('app-hidden');
    pageTabs.classList.add('app-hidden');
    stats.classList.add('app-hidden');
    return;
  }
  const err = document.getElementById('loginError');
  try{
    const roleSnap = await _db.collection('roles').doc(user.uid).get();
    const role = roleSnap.exists ? roleSnap.data() : null;
    if(!role || !role.techName){
      err.textContent = t('errRole');
      await _auth.signOut();
      return;
    }
    document.getElementById('testerName').textContent = role.techName;
    overlay.classList.add('hide');
    testerBar.classList.remove('app-hidden');
    pageTabs.classList.remove('app-hidden');
    stats.classList.remove('app-hidden');
    await loadDashboard();
  }catch(e){
    err.textContent = t('errRoleLoad') + e.message;
    await _auth.signOut();
  }
});

async function loadDashboard(){
  const listEl = document.getElementById('list');
  listEl.className = 'loading';
  listEl.textContent = 'กำลังโหลด...';
  const todayStr = new Date().toISOString().slice(0,10);
  try{
    // firebase-firestore-compat doesn't expose count() aggregate queries here,
    // and where()+orderBy() on different fields needs a composite index we
    // don't have — fetch one ordered page (no where clause) and derive both
    // stats from it client-side instead.
    const snap = await _db.collection('qc_reports').orderBy('createdAt', 'desc').limit(1000).get();
    const all = snap.docs.map(d=>({id:d.id, ...d.data()}));
    document.getElementById('statTotal').textContent = all.length;
    document.getElementById('statToday').textContent = all.filter(d=>d.date===todayStr).length;
    renderList(all.slice(0, 20));
  }catch(e){
    listEl.className = 'err';
    listEl.textContent = 'โหลด Dashboard ไม่สำเร็จ: ' + e.message;
  }
}

function renderList(list){
  const listEl = document.getElementById('list');
  if(!list.length){
    listEl.className = 'empty';
    listEl.textContent = 'ยังไม่มีรายงาน';
    return;
  }
  listEl.className = '';
  listEl.innerHTML = '';
  list.forEach(doc=>{
    const dateStr = doc.date ? doc.date.split('-').reverse().join('/') : '(ไม่ระบุวันที่)';
    const tplLabel = TEMPLATE_LABELS[doc.tpl] || doc.tpl || '';
    const a = document.createElement('a');
    a.className = 'history-item';
    a.href = `form.html?report=${encodeURIComponent(doc.id)}`;
    a.innerHTML = `<div class="title">${escapeHtmlLite(dateStr)} ${escapeHtmlLite(tplLabel)} ${escapeHtmlLite(doc.customer||'')}</div><div class="meta">ทะเบียน: ${escapeHtmlLite(doc.plate||'-')} · ช่าง: ${escapeHtmlLite(doc.techName||'-')}</div>`;
    listEl.appendChild(a);
  });
}

const APP_VERSION = document.querySelector('meta[name="app-version"]').content;
document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
document.getElementById('loginVersion').textContent = APP_VERSION;
</script>
